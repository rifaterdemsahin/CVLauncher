<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Response Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --panel-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: 600;
            font-size: 1.25rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            display: flex;
            gap: 1px;
            background-color: var(--border);
        }

        .panel {
            flex: 1;
            background-color: var(--panel-bg);
            display: flex;
            flex-direction: column;
            padding: 2rem;
            overflow-y: auto;
        }

        h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1.5rem;
        }

        textarea {
            flex: 1;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            color: var(--text);
            padding: 1rem;
            font-size: 1rem;
            line-height: 1.6;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .submit-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .response-container {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            font-size: 1rem;
            line-height: 1.6;
            min-height: 200px;
        }

        .response-container p { margin-bottom: 1rem; }
        .response-container h1, .response-container h2 { margin: 1.5rem 0 1rem 0; }
        .response-container ul { margin-left: 1.5rem; margin-bottom: 1rem; }

        .loading {
            color: var(--text-muted);
            font-style: italic;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 0.25rem;
            margin-top: 1rem;
            width: fit-content;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .copy-btn:hover {
            background: var(--border);
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 768px) {
            main { flex-direction: column; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Recruiter AI Agent</div>
        <div style="font-size: 0.875rem; color: var(--text-muted)">Powered by xAI & Doppler</div>
    </header>
    <main>
        <section class="panel">
            <h2>Recruiter's Request</h2>
            <textarea id="requestInput" placeholder="Paste the recruiter's email or LinkedIn message here..."></textarea>
            <button class="submit-btn" id="submitBtn">Generate Response</button>
        </section>
        <section class="panel">
            <h2>Generated Response</h2>
            <div id="responseOutput" class="response-container">
                <p class="loading">Response will appear here...</p>
            </div>
            <button class="copy-btn" id="copyBtn" style="display: none;">Copy to Clipboard</button>
        </section>
    </main>

    <script>
        const md = window.markdownit();
        const submitBtn = document.getElementById('submitBtn');
        const requestInput = document.getElementById('requestInput');
        const responseOutput = document.getElementById('responseOutput');
        const copyBtn = document.getElementById('copyBtn');

        submitBtn.addEventListener('click', async () => {
            const request = requestInput.value.trim();
            if (!request) return alert('Please enter a request');

            submitBtn.disabled = true;
            submitBtn.textContent = 'Generating...';
            responseOutput.innerHTML = '<p class="loading">Consulting xAI and reviewing your CV...</p>';
            copyBtn.style.display = 'none';

            try {
                const res = await fetch('/api/respond', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recruiterRequest: request })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                responseOutput.innerHTML = md.render(data.response);
                copyBtn.style.display = 'block';
                copyBtn.onclick = () => {
                    navigator.clipboard.writeText(data.response);
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => copyBtn.textContent = 'Copy to Clipboard', 2000);
                };

            } catch (err) {
                responseOutput.innerHTML = `<p style="color: #ef4444">Error: ${err.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Response';
            }
        });
    </script>
</body>
</html>
