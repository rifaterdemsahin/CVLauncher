<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV Manager</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- MAIN CONTENT – AS WIDE AS POSSIBLE ---------- */
        .main-content {
            flex: 1;                                   /* push footer down */
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 20px 20px 0 20px;                  /* top padding only */
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 1200px;                         /* same as footer */
            min-height: 60vh;
            max-height: 80vh;
            display: grid;
            grid-template-columns: 400px 1fr;
            overflow: hidden;
        }

        /* ---------- FOOTER – ALWAYS AT BOTTOM ---------- */
        footer {
            flex-shrink: 0;
            width: 100%;
            padding: 30px 20px 20px 20px;
            background: rgba(0,0,0,0.08);
        }
        footer .container-fluid { max-width: 1200px; margin:0 auto; }

        /* ---------- ORIGINAL STYLES (unchanged) ---------- */
        .sidebar { background:#f8f9fa; border-right:1px solid #e9ecef; display:flex; flex-direction:column; }
        .header { padding:24px; border-bottom:1px solid #e9ecef; }
        .header h1 { font-size:24px; color:#212529; margin-bottom:16px; }
        .search-box { position:relative; }
        .search-box input { width:100%; padding:12px 16px 12px 40px; border:2px solid #dee2e6; border-radius:8px; font-size:14px; transition:all .2s; }
        .search-box input:focus { outline:none; border-color:#667eea; box-shadow:0 0 0 3px rgba(102,126,234,.1); }
        .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:#6c757d; }
        .cv-list { flex:1; overflow-y:auto; padding:8px; }
        .cv-item { padding:12px 16px; margin-bottom:4px; border-radius:8px; cursor:pointer; transition:all .2s; border:2px solid transparent; }
        .cv-item:hover { background:#e9ecef; }
        .cv-item.selected { background:#667eea; color:white; border-color:#667eea; }
        .cv-item-name { font-weight:600; font-size:14px; margin-bottom:4px; }
        .cv-item-desc { font-size:12px; opacity:.7; }
        .cv-item-tag { display:inline-block; padding:2px 8px; background:rgba(0,0,0,.1); border-radius:4px; font-size:11px; margin-top:4px; }
        .cv-item.selected .cv-item-tag { background:rgba(255,255,255,.2); }
        .main-panel { display:flex; flex-direction:column; }
        .preview-header { padding:24px; border-bottom:1px solid #e9ecef; display:flex; justify-content:space-between; align-items:center; }
        .preview-title { font-size:20px; font-weight:600; color:#212529; }
        .actions { display:flex; gap:12px; }
        .btn { padding:10px 20px; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; transition:all .2s; display:flex; align-items:center; gap:8px; }
        .btn-primary { background:#667eea; color:white; }
        .btn-primary:hover { background:#5568d3; transform:translateY(-1px); box-shadow:0 4px 12px rgba(102,126,234,.4); }
        .btn-secondary { background:#e9ecef; color:#495057; }
        .btn-secondary:hover { background:#dee2e6; }
        .preview-content { flex:1; padding:24px; overflow-y:auto; background:#fafafa; }
        .preview-box { background:white; border:1px solid #e9ecef; border-radius:8px; padding:24px; font-family:'Courier New',monospace; font-size:13px; line-height:1.6; white-space:pre-wrap; min-height:400px; }
        .empty-state { text-align:center; padding:60px 20px; color:#6c757d; }
        .empty-state svg { margin-bottom:16px; opacity:.3; }
        .stats { padding:16px 24px; border-top:1px solid #e9ecef; display:flex; justify-content:space-between; align-items:center; font-size:12px; color:#6c757d; }
        .notification { position:fixed; top:20px; right:20px; background:#28a745; color:white; padding:16px 24px; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.15); display:none; align-items:center; gap:12px; animation:slideIn .3s ease; }
        .notification.show { display:flex; }
        @keyframes slideIn { from{transform:translateX(400px);opacity:0} to{transform:translateX(0);opacity:1} }
        .no-results { padding:40px; text-align:center; color:#6c757d; }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#dee2e6; border-radius:4px; }
        ::-webkit-scrollbar-thumb:hover { background:#ced4da; }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width:768px){
            .main-content { padding:10px 10px 0 10px; }
            .container { grid-template-columns:1fr; max-height:none; }
            .sidebar { border-right:none; border-bottom:1px solid #e9ecef; }
            .header { padding:16px; }
            .header h1 { font-size:20px; }
            .cv-list { max-height:200px; }
            .preview-header { padding:16px; flex-wrap:wrap; gap:10px; }
            .actions { gap:8px; width:100%; justify-content:stretch; }
            .actions .btn { flex:1; justify-content:center; padding:12px 16px; font-size:13px; }
            .preview-content { padding:16px; }
            .preview-box { padding:16px; font-size:12px; min-height:300px; }
            footer { padding:20px 15px; }
        }
        @media (max-width:576px){
            .main-content { padding:5px 5px 0 5px; }
            .container { border-radius:8px; margin:10px 0; min-height:50vh; }
            .header { padding:12px; }
            .search-box input { font-size:14px; }
            .preview-header { padding:12px; }
            .actions .btn { padding:10px 12px; font-size:12px; }
            .preview-content { padding:12px; }
            .preview-box { padding:12px; font-size:11px; min-height:250px; }
            footer { padding:20px 15px 15px 15px; }
            .social-link { width:35px !important; height:35px !important; }
            .social-link svg { width:18px !important; height:18px !important; }
            .support-btn { padding:10px 20px !important; font-size:14px !important; }
            .github-badge img { height:25px !important; }
        }
    </style>
</head>
<body>

                    <h1>CV Manager</h1>

            { id: 'security_architect', name: 'Security Architect', desc: 'Security Architect', tag: 'Security', file: 'cvs/cv_security_architect.md' },
            { id: 'security_devops', name: 'Security DevOps', desc: 'Security DevOps Engineer', tag: 'Security', file: 'cvs/cv_security_devops.md' },
            { id: 'security_engineer', name: 'Security Engineer', desc: 'Security Engineer', tag: 'Security', file: 'cvs/cv_security_engineer.md' },
            { id: 'senior_devops', name: 'Senior DevOps', desc: 'Senior DevOps Engineer', tag: 'DevOps', file: 'cvs/cv_senior_devops.md' },
            { id: 'sre_engineer', name: 'SRE Engineer', desc: 'Site Reliability Engineer', tag: 'Engineering', file: 'cvs/cv_sre_engineer.md' },
            { id: 'systems_engineer', name: 'Systems Engineer', desc: 'Systems Engineer', tag: 'Engineering', file: 'cvs/cv_systems_engineer.md' }
        ];

        let selectedCV = null;
        let filteredCVs = cvData;
        const loadedContent = new Map();

        const searchInput = document.getElementById('searchInput');
        const cvList = document.getElementById('cvList');
        const previewBox = document.getElementById('previewBox');
        const previewTitle = document.getElementById('previewTitle');
        const copyBtn = document.getElementById('copyBtn');
        const editBtn = document.getElementById('editBtn');
        const notification = document.getElementById('notification');
        const cvCount = document.getElementById('cvCount');

        async function loadCVContent(cv) {
            if (loadedContent.has(cv.id)) return loadedContent.get(cv.id);
            try {
                const r = await fetch(cv.file);
                const txt = r.ok ? await r.text() : `# ${cv.desc}\n\n*CV file not found.*`;
                loadedContent.set(cv.id, txt);
            } catch { loadedContent.set(cv.id, `# ${cv.desc}\n\n*Error loading.*`); }
            return loadedContent.get(cv.id);
        }

        function renderCVList() {
            cvList.innerHTML = filteredCVs.length ? '' : '<div class="no-results">No CVs found</div>';
            filteredCVs.forEach(cv => {
                const el = document.createElement('div');
                el.className = 'cv-item' + (selectedCV?.id===cv.id ? ' selected' : '');
                el.innerHTML = `<div class="cv-item-name">/cv${cv.id}</div>
                                <div class="cv-item-desc">${cv.desc}</div>
                                <div class="cv-item-tag">${cv.tag}</div>`;
                el.onclick = () => selectCV(cv);
                cvList.appendChild(el);
            });
            cvCount.textContent = `${filteredCVs.length} CV${filteredCVs.length===1?'':'s'}`;
        }

        async function selectCV(cv) {
            selectedCV = cv;
            renderCVList();
            previewTitle.textContent = cv.desc;
            previewBox.innerHTML = '<div class="loading-state">Loading CV content...</div>';
            const content = await loadCVContent(cv);
            if (selectedCV?.id===cv.id) previewBox.textContent = content;
        }

        function filterCVs(q) {
            q = q.toLowerCase();
            filteredCVs = cvData.filter(cv => 
                cv.name.toLowerCase().includes(q) || 
                cv.desc.toLowerCase().includes(q) || 
                cv.tag.toLowerCase().includes(q) || 
                cv.id.toLowerCase().includes(q));
            renderCVList();
        }

        async function copyToClipboard() {
            if (!selectedCV) return;
            const txt = await loadCVContent(selectedCV);
            navigator.clipboard.writeText(txt).then(showNotification);
        }

        function showNotification() {
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 2000);
        }

        async function editCV() {
            if (!selectedCV) return;
            const cur = await loadCVContent(selectedCV);
            const neu = prompt('Edit CV content:', cur);
            if (neu !== null) {
                loadedContent.set(selectedCV.id, neu);
                previewBox.textContent = neu;
                showNotification();
            }
        }

        searchInput.addEventListener('input', e => filterCVs(e.target.value));
        copyBtn.addEventListener('click', copyToClipboard);
        editBtn.addEventListener('click', editCV);

        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.key==='k') { e.preventDefault(); searchInput.focus(); searchInput.select(); }
            if (e.ctrlKey && e.key==='Enter') { e.preventDefault(); copyToClipboard(); }
            if (['ArrowDown','ArrowUp'].includes(e.key)) {
                e.preventDefault();
                const idx = filteredCVs.findIndex(c=>c.id===selectedCV?.id);
                const next = e.key==='ArrowDown' 
                    ? (idx < filteredCVs.length-1 ? idx+1 : 0)
                    : (idx > 0 ? idx-1 : filteredCVs.length-1);
                if (filteredCVs[next]) selectCV(filteredCVs[next]);
            }
        });

        renderCVList();
        if (cvData.length) selectCV(cvData[0]);
    </script>
