<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruiter Response Agent</title>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --bg: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #c084fc;
            --error: #f87171;
            --debug-bg: rgba(15, 23, 42, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1.25rem 2.5rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-weight: 600;
            font-size: 1.5rem;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.02em;
        }

        main {
            flex: 1;
            display: flex;
            gap: 2rem;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .panel {
            flex: 1;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .panel:hover { border-color: rgba(129, 140, 248, 0.3); }

        h2 {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        h2::before {
            content: '';
            display: block;
            width: 4px;
            height: 16px;
            background: var(--primary);
            border-radius: 2px;
        }

        textarea {
            flex: 1;
            min-height: 260px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            color: var(--text);
            padding: 1.25rem;
            font-size: 1rem;
            line-height: 1.7;
            resize: none;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        textarea:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            padding: 1.125rem;
            border-radius: 0.75rem;
            font-weight: 600;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            filter: brightness(1.1);
        }

        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .response-container {
            flex: 1;
            min-height: 260px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .response-content { font-size: 1.05rem; line-height: 1.8; color: #d1d5db; }
        .response-content p { margin-bottom: 1.25rem; }
        .response-content h1, .response-content h2, .response-content h3 {
            color: white;
            margin: 1.5rem 0 1rem 0;
        }
        .response-content a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .response-content a:hover { border-color: var(--primary); }

        .btn-row {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .copy-btn {
            background: rgba(129, 140, 248, 0.15);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn:hover {
            background: rgba(129, 140, 248, 0.25);
            transform: translateY(-1px);
        }

        .copy-btn.success {
            background: rgba(52, 211, 153, 0.15);
            border-color: #34d399;
            color: #34d399;
        }

        .debug-toggle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .debug-toggle-btn:hover { background: rgba(255,255,255,0.1); color: var(--text); }

        /* Debug panel */
        .debug-panel {
            margin-top: 1rem;
            background: var(--debug-bg);
            border: 1px solid rgba(248, 113, 113, 0.3);
            border-radius: 0.75rem;
            overflow: hidden;
            display: none;
        }

        .debug-panel.visible { display: block; }

        .debug-panel-header {
            background: rgba(248, 113, 113, 0.1);
            border-bottom: 1px solid rgba(248, 113, 113, 0.2);
            padding: 0.6rem 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--error);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .debug-panel pre {
            padding: 1rem;
            font-size: 0.8rem;
            line-height: 1.6;
            color: #94a3b8;
            overflow-x: auto;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }

        .loading-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 1024px) {
            main { flex-direction: column; }
            .panel { min-height: 350px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Recruiter AI Agent</div>
        <div style="font-size: 0.875rem; color: var(--text-muted)">Powered by xAI Grok</div>
    </header>
    <main>
        <!-- Input Panel -->
        <section class="panel">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                Recruiter's Request
            </h2>
            <textarea id="requestInput" placeholder="Paste the recruiter's email or LinkedIn message here..."></textarea>
            <button class="submit-btn" id="submitBtn">Generate Professional Response</button>
        </section>

        <!-- Output Panel -->
        <section class="panel">
            <h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                Generated Response
            </h2>
            <div id="responseOutput" class="response-container">
                <div class="response-content">
                    <p style="color: var(--text-muted); font-style: italic;">The AI will generate a tailored response here based on your master CV...</p>
                </div>
            </div>

            <div class="btn-row" id="btnRow" style="display: none;">
                <button class="copy-btn" id="copyBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy Response
                </button>
                <button class="debug-toggle-btn" id="debugToggleBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Debug Info
                </button>
            </div>

            <div class="debug-panel" id="debugPanel">
                <div class="debug-panel-header">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                    Debug / Error Info
                </div>
                <pre id="debugContent"></pre>
            </div>
        </section>
    </main>

    <script>
        const md = window.markdownit();
        const submitBtn = document.getElementById('submitBtn');
        const requestInput = document.getElementById('requestInput');
        const responseOutput = document.getElementById('responseOutput');
        const btnRow = document.getElementById('btnRow');
        const copyBtn = document.getElementById('copyBtn');
        const debugToggleBtn = document.getElementById('debugToggleBtn');
        const debugPanel = document.getElementById('debugPanel');
        const debugContent = document.getElementById('debugContent');

        let rawResponse = '';

        debugToggleBtn.addEventListener('click', () => {
            debugPanel.classList.toggle('visible');
            debugToggleBtn.textContent = debugPanel.classList.contains('visible') ? '▲ Hide Debug' : '▼ Debug Info';
        });

        copyBtn.addEventListener('click', async () => {
            if (!rawResponse) return;
            try {
                await navigator.clipboard.writeText(rawResponse);
                copyBtn.classList.add('success');
                copyBtn.innerHTML = `
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    Copied!`;
                setTimeout(() => {
                    copyBtn.classList.remove('success');
                    copyBtn.innerHTML = `
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy Response`;
                }, 2000);
            } catch (e) {
                // Fallback for non-HTTPS or older browsers
                const ta = document.createElement('textarea');
                ta.value = rawResponse;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                copyBtn.classList.add('success');
                copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
                setTimeout(() => {
                    copyBtn.classList.remove('success');
                    copyBtn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg> Copy Response';
                }, 2000);
            }
        });

        submitBtn.addEventListener('click', async () => {
            const request = requestInput.value.trim();
            if (!request) return alert('Please enter a request');

            rawResponse = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Consulting xAI Grok...';
            responseOutput.className = 'response-container loading-shimmer';
            responseOutput.innerHTML = '<div class="response-content"><p style="color: var(--text-muted)">Analyzing recruiter intent and matching with your experience...</p></div>';
            btnRow.style.display = 'none';
            debugPanel.classList.remove('visible');
            debugContent.textContent = '';

            try {
                const res = await fetch('/api/respond', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ recruiterRequest: request })
                });

                const data = await res.json();

                // Always show debug info if available
                if (data.debug) {
                    debugContent.textContent = JSON.stringify(data.debug, null, 2);
                }

                if (!res.ok || data.error) {
                    const errMsg = data.error || `HTTP ${res.status}`;
                    responseOutput.className = 'response-container';
                    responseOutput.innerHTML = `<div class="response-content" style="color: var(--error)">
                        <strong>Error:</strong> ${errMsg}
                    </div>`;
                    btnRow.style.display = 'flex';
                    debugPanel.classList.add('visible');
                    return;
                }

                rawResponse = data.response;
                responseOutput.className = 'response-container';
                responseOutput.innerHTML = `<div class="response-content">${md.render(data.response)}</div>`;
                btnRow.style.display = 'flex';

            } catch (err) {
                responseOutput.className = 'response-container';
                responseOutput.innerHTML = `<div class="response-content" style="color: var(--error)">
                    <strong>Network error:</strong> ${err.message}
                </div>`;
                debugContent.textContent = `Fetch error: ${err.message}\nStack: ${err.stack}`;
                btnRow.style.display = 'flex';
                debugPanel.classList.add('visible');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Generate Professional Response';
            }
        });
    </script>
</body>
</html>
